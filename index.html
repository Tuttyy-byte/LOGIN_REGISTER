<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Portal | Login & Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <div class="header">
                <h1>👋 Welcome Back</h1>
                <p>Sign in to continue or create a new account</p>
            </div>

            <!-- Display messages from PHP -->
            <?php if (isset($_GET['error'])): ?>
                <div class="error-message"><?php echo htmlspecialchars($_GET['error']); ?></div>
            <?php endif; ?>
            <?php if (isset($_GET['success'])): ?>
                <div class="success-message"><?php echo htmlspecialchars($_GET['success']); ?></div>
            <?php endif; ?>

            <div class="tab-buttons">
                <button class="tab-btn <?php echo (!isset($_GET['show']) || $_GET['show'] != 'register') ? 'active' : ''; ?>" id="loginTab">Sign In</button>
                <button class="tab-btn <?php echo (isset($_GET['show']) && $_GET['show'] == 'register') ? 'active' : ''; ?>" id="registerTab">Create Account</button>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginForm" class="form <?php echo (!isset($_GET['show']) || $_GET['show'] != 'register') ? 'active-form' : ''; ?>">
                <form action="login.php" method="POST">
                    <div class="input-group">
                        <label for="loginEmail">📧 Email Address</label>
                        <input type="email" id="loginEmail" name="email" placeholder="hello@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="loginPassword">🔒 Password</label>
                        <input type="password" id="loginPassword" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="submit-btn">Sign In</button>
                </form>
                <div class="form-footer">
                    <a href="#">Forgot your password?</a>
                </div>
            </div>

            <!-- REGISTER FORM -->
            <div id="registerForm" class="form <?php echo (isset($_GET['show']) && $_GET['show'] == 'register') ? 'active-form' : ''; ?>">
                <form action="register.php" method="POST">
                    <div class="input-group">
                        <label for="regName">👤 Full Name</label>
                        <input type="text" id="regName" name="fullname" placeholder="John Doe" required>
                    </div>
                    <div class="input-group">
                        <label for="regEmail">📧 Email Address</label>
                        <input type="email" id="regEmail" name="email" placeholder="john@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="regPassword">🔒 Password</label>
                        <input type="password" id="regPassword" name="password" placeholder="At least 6 characters" required>
                    </div>
                    <div class="input-group">
                        <label for="regConfirm">✅ Confirm Password</label>
                        <input type="password" id="regConfirm" name="confirm_password" placeholder="Re-enter your password" required>
                    </div>
                    <button type="submit" class="submit-btn">Register</button>
                </form>
                <div class="form-footer">
                    <p>Already have an account? <a href="#" id="switchToLogin">Sign in here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const switchToLogin = document.getElementById('switchToLogin');

        function showLogin() {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.classList.add('active-form');
            registerForm.classList.remove('active-form');
            window.history.pushState({}, '', 'index.php');
        }

        function showRegister() {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            registerForm.classList.add('active-form');
            loginForm.classList.remove('active-form');
            window.history.pushState({}, '', '?show=register');
        }

        loginTab.addEventListener('click', showLogin);
        registerTab.addEventListener('click', showRegister);
        if (switchToLogin) {
            switchToLogin.addEventListener('click', (e) => {
                e.preventDefault();
                showLogin();
            });
        }
    </script>
</body>
</html>
